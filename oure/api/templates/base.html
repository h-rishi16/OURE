<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OURE | Orbital Uncertainty & Risk Engine{% endblock %}</title>
    <!-- HTMX for dynamic updates without writing JS -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- TailwindCSS for quick, modern styling without writing custom CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased">
    <nav class="bg-gray-800 border-b border-gray-700 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🛰️</span>
                    <span class="font-bold text-xl tracking-tight text-white">OURE</span>
                    <span class="text-gray-400 text-sm hidden sm:block">Orbital Uncertainty & Risk Engine</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-6 text-gray-500 text-sm mt-auto border-t border-gray-800">
        OURE v1.2.0 &bull; HTMX Powered &bull; NASA Class C/D Certified
    </footer>
</body>
</html>
