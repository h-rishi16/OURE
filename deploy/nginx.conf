events {}

http {
    server {
        listen 80;

        # Grafana Dashboard
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $http_host;
        }

        # Prometheus Metrics
        location /prometheus/ {
            proxy_pass http://prometheus:9090/prometheus/;
            proxy_set_header Host $http_host;
        }

        # OURE REST API
        location / {
            proxy_pass http://api:8000/;
            proxy_set_header Host $http_host;
        }
    }
}
