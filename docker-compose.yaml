
services:
  # The FastAPI REST Backend
  api:
    build: .
    command: uvicorn oure.api.main:app --host 0.0.0.0 --port 8000
    environment:
      - SPACETRACK_USER=${SPACETRACK_USER}
      - SPACETRACK_PASS=${SPACETRACK_PASS}
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The Celery Worker for heavy physics tasks
  worker:
    build: .
    command: celery -A oure.api.tasks.celery_app worker --loglevel=info
    environment:
      - SPACETRACK_USER=${SPACETRACK_USER}
      - SPACETRACK_PASS=${SPACETRACK_PASS}
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat for periodic tasks
  celery-beat:
    build: .
    command: celery -A oure.api.celery_app beat --loglevel=info
    environment:
      - SPACETRACK_USER=${SPACETRACK_USER}
      - SPACETRACK_PASS=${SPACETRACK_PASS}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - OURE_WATCHLIST_ASSETS=25544
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Redis Broker
  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Metrics: Prometheus
  prometheus:
    image: prom/prometheus:v2.48.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.external-url=/prometheus'
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # Visualizer: Grafana
  grafana:
    image: grafana/grafana:10.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - prometheus
    restart: unless-stopped

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - grafana
      - prometheus
    restart: unless-stopped
