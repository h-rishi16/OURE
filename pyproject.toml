[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oure"
version = "1.0.0"
description = "Orbital Uncertainty & Risk Engine --- Satellite Collision Probability Solver"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Hrishi Joshi", email = "hrishirjoshi16324@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["orbit", "satellite", "collision", "space", "astrodynamics", "SGP4", "conjunction"]


dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "sgp4>=2.22",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "rich>=13.7",
    "structlog>=24.1",
    "tenacity>=8.2",
    "httpx>=0.27",
    "fpdf2>=2.7",
    "reportlab>=4.0",
    "plotly>=5.18",
    "polars>=0.20.0",
    "prometheus-client>=0.19.0",
    "astropy>=6.0",
    "rich-click>=1.8.0",
    "click-repl>=0.3",
    "pytest>=8",
    "pytest-cov",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit",
    "faker",
    "scipy-stubs",
    "pandas-stubs",
    "types-requests",
    "types-redis",
    "types-python-dateutil",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "celery>=5.3",
    "redis>=5.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[project.scripts]
oure = "oure.cli.main:cli"

[tool.ruff.lint]
select = ["E","F","W","I"]
ignore = ["E501", "E701", "W293", "F841", "E402", "W291"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]

strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_any_generics = false
warn_unused_ignores = false
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=oure --cov-report=term-missing --cov-fail-under=86"
filterwarnings = [
    "ignore:.*unclosed database.*",
    "ignore:.*maximum number of subdivisions.*",
]
markers = [
    "req(id): mark test as verifying a specific software requirement (SWE-052 Traceability)"
]

[tool.coverage.run]
omit = ["*/tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["oure"]

[project.urls]
Homepage = "https://github.com/h-rishi16/oure"
Repository = "https://github.com/h-rishi16/oure.git"
Issues = "https://github.com/h-rishi16/oure/issues"
