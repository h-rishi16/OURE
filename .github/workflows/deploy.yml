name: Deploy to Oracle Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Build Next.js Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          
      - name: Transfer built assets to Oracle Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "frontend/.next"
          target: "~/"
          
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # Try to enter the directory regardless of case (oure vs OURE)
            cd ~/oure || cd ~/OURE || exit 1
            
            git fetch origin
            git reset --hard origin/main
            git pull origin main
            
            # Ensure the transferred .next folder is moved into the frontend directory
            # because scp might have dropped it in ~ if the paths didn't perfectly align
            cp -r ~/frontend/.next ./frontend/ 2>/dev/null || true
            
            docker compose --env-file keys.env up --build -d
            docker image prune -f
