name: Deploy to Oracle Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Build Next.js Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          
      - name: Transfer built assets to Oracle Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "frontend/.next"
          target: "~/"
          
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # Try to enter the directory regardless of case (oure vs OURE)
            cd ~/oure || cd ~/OURE || exit 1
            
            git fetch origin
            git reset --hard origin/main
            git pull origin main
            
            # Completely wipe old Next.js build cache to prevent merging bugs
            rm -rf ./frontend/.next
            
            # Copy fresh build from the SCP drop location
            cp -r ~/frontend/.next ./frontend/ 2>/dev/null || true
            
            # Force Docker to completely rebuild the frontend without using cache
            docker compose --env-file keys.env build --no-cache frontend
            docker compose --env-file keys.env up -d
            
            # Cleanup
            docker image prune -f
